  - title: 'Real-world Results'
    id: section-6
    highlight: |
      <p class="eyebrow">Real-world evaluation / Unseen placements</p>
      <h3 class="results-headline">Higher success across all three OOD tasks.</h3>
      <p class="results-intro">Success rates under OOD position and rotation shifts. ALOHA · 20 trials per task and method.</p>
      <div class="comparison-grid">
        <article class="comparison-card"><h4>Object handoff</h4><p class="comparison-value">95<span>%</span></p><p class="comparison-gain">+75 points over π₀.₅</p>
          <div class="comparison-row ours"><span>DR-LfD</span><div class="comparison-track"><div style="width:95%"></div></div><strong>95%</strong></div>
          <div class="comparison-row baseline"><span>DP</span><div class="comparison-track"><div style="width:30%"></div></div><strong>30%</strong></div>
          <div class="comparison-row baseline"><span>π₀.₅</span><div class="comparison-track"><div style="width:20%"></div></div><strong>20%</strong></div>
        </article>
        <article class="comparison-card"><h4>Screwdriver packing</h4><p class="comparison-value">80<span>%</span></p><p class="comparison-gain">+70 points over π₀.₅</p>
          <div class="comparison-row ours"><span>DR-LfD</span><div class="comparison-track"><div style="width:80%"></div></div><strong>80%</strong></div>
          <div class="comparison-row baseline"><span>DP</span><div class="comparison-track"><div style="width:10%"></div></div><strong>10%</strong></div>
          <div class="comparison-row baseline"><span>π₀.₅</span><div class="comparison-track"><div style="width:10%"></div></div><strong>10%</strong></div>
        </article>
        <article class="comparison-card"><h4>Cup-sleeve insertion</h4><p class="comparison-value">75<span>%</span></p><p class="comparison-gain">+50 points over π₀.₅</p>
          <div class="comparison-row ours"><span>DR-LfD</span><div class="comparison-track"><div style="width:75%"></div></div><strong>75%</strong></div>
          <div class="comparison-row baseline"><span>DP</span><div class="comparison-track"><div style="width:35%"></div></div><strong>35%</strong></div>
          <div class="comparison-row baseline"><span>π₀.₅</span><div class="comparison-track"><div style="width:25%"></div></div><strong>25%</strong></div>
        </article>
      </div>
    text: |
      <details>
      <summary>Full results, evaluation protocol, and limitations</summary>

      #### Spatial Generalization — Real World (n = 20 per setup)

      Each task uses 20 demonstrations. DP and DR-LfD are trained from scratch on these demonstrations, and π₀.₅ is fine-tuned on the same data. ID, OOD, and Leaky placements are defined in [Real-world Task Settings](#section-8).

      | Task | Setup | DP | π₀.₅ | **DR-LfD** |
      |---|---|---|---|---|
      | Object Handoff | ID | 90% | 100% | **100%** |
      | | OOD | 30% | 20% | **95%** |
      | | Leaky | 60% | 90% | **100%** |
      | Screwdriver Packing | ID | 55% | 60% | **80%** |
      | | OOD | 10% | 10% | **80%** |
      | | Leaky | 0% | **75%** | 65% |
      | Cup-sleeve Insertion | ID | 75% | **85%** | 80% |
      | | OOD | 35% | 25% | **75%** |
      | | Leaky | 35% | 35% | **40%** |

      In the Leaky setting, π₀.₅ leads on Screwdriver Packing. Cup-sleeve Insertion remains difficult for all methods; fine insertion and noisy single-view depth sensing contribute to failures.

      </details>

  - title: 'Simulation Benchmarks (LIBERO & DexMimicGen)'
    id: section-7
    text: |
      **LIBERO.** DR-LfD reaches 98% on both the Spatial and Object suites, versus 84% and 78% for Diffusion Policy trained with 50 demos per task. On Long8, adding online perception raises the success rate of DR-LfD from 30% to 90% over 10 rollouts.

      **Data efficiency on DexMimicGen.** On the contact-rich Two-Arm Threading and Two-Arm Assembly tasks, we train DR-LfD, Diffusion Policy (DP), and SE(3)-equivariant SDP with 100 to 1000 demonstrations per task.

      <figure>
        <img src="paper-figures/dexmimicgen_scaling.png" alt="Success rates versus 100, 200, 500, and 1000 training demonstrations on Two-Arm Threading and Two-Arm Assembly, comparing DR-LfD, DP, and SDP." loading="lazy" style="display:block;width:100%;max-width:600px;height:auto;margin:0 auto;" />
        <figcaption>Success rates on two DexMimicGen tasks with different numbers of demonstrations, evaluated over 50 trials per setting. Error bars show 95% Wilson confidence intervals.</figcaption>
      </figure>

      DR-LfD trained on just 100 demonstrations outperforms DP and SDP trained with 1000 demonstrations.

