  - title: 'Constraint Handling'
    id: section-2
    text: |
      <article class="media-card">
        <div class="media-card__copy">
          <h3>Reachability and obstacle avoidance</h3>
          <p>DR-LfD exposes the reachability and collision constraints of each visuomotor policy to TAMP, which inserts corrective actions when a constraint is violated.</p>
        </div>
        <figure>
          <img src="paper-figures/real-unreach-unsafe.webp" alt="Real-world reachability map with the cup sleeve out of reach, and collision map with a plunger blocking cup wiping, each followed by the planned recovery steps." loading="lazy" />
        </figure>
      </article>

