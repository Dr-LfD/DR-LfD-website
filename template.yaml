teaser: paper-figures/tro-teaser.png
abstract: |
  Successfully automating dexterous, long-horizon robotic manipulation requires frameworks capable of both high-level reasoning and fine-grained execution.  Traditional task and motion planning (TAMP), while excellent in symbolic planning, is often brittle in contact-rich operations. Simultaneously, imitation learning (IL), while effective in manipulation tasks with visual feedback, is limited by its low capability in spatial generalization and multi-stage operation.   To reconcile their complementary strengths and limitations, we propose *DR-LfD* (<u>D</u>ecomposed and <u>R</u>eorganized Skills <u>L</u>earned <u>f</u>rom <u>D</u>emonstrations), a framework that seamlessly integrates visuomotor policies into a TAMP-gated decision-making system.  According to contact relationships, DR-LfD  decomposes human demonstrations into atomic skills, which are reproduced as visuomotor policies or object-centric primitives. The initiation, termination, and constraints of the visuomotor policies are carefully modeled and implemented in a TAMP-compatible form, enabling reorganization of skills learned from different sources.  DR-LfD transforms the learning problem from one requiring exponential data to one that scales linearly with the number of distinct skill types, with limited demonstration data for each skill.  Through comprehensive real-world and simulation benchmarking across diverse scenarios, we demonstrate the strong performance of DR-LfD on tasks involving multiple steps, unseen setups, and physical constraints.
body:
  - title: 'Key Contributions'
    text: |
      > **Core idea:** We learn individual manipulation skills from a small number of demonstrations and reorganize them using a TAMP solver to achieve combinatorial goals.

      - **TAMP-gated system** — We devise a novel TAMP-gated system that abstracts atomic skills from demonstrations and reorganizes them to achieve combinatorial goals.
      - **Object-centric primitives** — We leverage equivariant diffusion models to train object-centric primitives, enabling robust spatial generalization from minimal data.
      - **TAMP-compatible visuomotor policies** — We systematically model the initiation, termination, and constraints of learned visuomotor policies in a form compatible with a sampling-based TAMP framework.
      - **Comprehensive evaluation** — We demonstrate through comprehensive real-world and simulated experiments that DR-LfD completes long-horizon manipulation tasks under challenging conditions while complying with physical constraints, significantly outperforming state-of-the-art imitation learning methods.

  - title: 'How It Works'
    text: |
      ### Pipeline

      <div class="method-pipeline" aria-label="DR-LfD method pipeline">
        <div><strong>1</strong><span>Demonstrate</span></div>
        <div><strong>2</strong><span>Decompose<br>by contact</span></div>
        <div><strong>3</strong><span>Learn skill<br>repertoire</span></div>
        <div><strong>4</strong><span>Plan with<br>TAMP</span></div>
        <div><strong>5</strong><span>Execute &amp;<br>verify</span></div>
      </div>

      1. **Demonstrate** — Record about 20 teleoperated examples of each short skill. Full task sequences are not required.
      2. **Decompose** — A VLM finds changes in robot–object and object–object contact. Each segment becomes an atomic skill with clear start and end conditions.


      <img src="paper-figures/vlm-grounding.png" alt="VLM-based contact relationship grounding for demonstration decomposition" loading="lazy" style="max-width:50%;" />

      3. **Learn each skill** — Train object-centric primitives for pick-and-place actions and visuomotor policies for contact-rich actions. Use standard TAMP motion skills for free-space moves.


      <img src="paper-figures/skillequivNet.png" alt="SO(3)-equivariant object-centric skill network" loading="lazy"  style="max-width:80%;" />

      4. **Plan a new task** — The task-and-motion planner (TAMP) selects and orders the learned skills. Safety and reachability constraints let it add regrasping or obstacle-removal steps when needed.
      5. **Execute and verify** — The robot perceives, plans, acts, and checks the result of each step. It replans locally if a step fails.

      ### System Advantages

      <div class="system-advantages" aria-label="DR-LfD system advantages">
        <a class="system-advantage-link" href="#section-4">
          <article class="uk-card uk-card-default uk-card-body system-advantage">
            <h4>Heterogeneous Skill Composition</h4>
            <p>The planner temporally composes visuomotor policies, object-centric primitives, and predefined motion skills. Contact conditions make each skill transition explicit and interpretable.</p>
          </article>
        </a>
        <a class="system-advantage-link" href="#section-3">
          <article class="uk-card uk-card-default uk-card-body system-advantage">
            <h4>Pose-Free Spatial Generalization</h4>
            <p>Object-centric primitives use SE(3)-equivariant learning to adapt to new object placements and orientations without explicit 6-DoF object-pose estimation.</p>
          </article>
        </a>
        <a class="system-advantage-link" href="#section-2">
          <article class="uk-card uk-card-default uk-card-body system-advantage">
            <h4>Physical Constraint Handling</h4>
            <p>Unlike prior visuomotor policies, DR-LfD exposes policy safety and reachability constraints to the planner. It can test whether a policy is feasible and insert corrective steps when needed.</p>
          </article>
        </a>
        <a class="system-advantage-link" href="#section-5">
          <article class="uk-card uk-card-default uk-card-body system-advantage">
            <h4>Dual-Arm Online Replanning</h4>
            <p>The system tracks dual-arm contact progress, re-perceives and verifies each skill outcome, and locally replans when the observed state differs from the expected state.</p>
          </article>
        </a>
      </div>

  - title: 'Constraint Handling: Reachability & Safety'
    text: |
      When physical constraints are violated, pure imitation learning baselines (ACT, DP) **score 0%** — they have no mechanism to adapt. DR-LfD uses reachability maps and Minimum-Distance-Field safety checks as TAMP-compatible predicates, enabling automatic insertion of corrective actions into the plan.

      <img src="paper-figures/tro-unsafe-unreachable.png" alt="Examples of unreachable and unsafe setups handled through planning" loading="lazy" />

      ### *Unreachable* Setup

      When the object falls outside one arm's reachability map, DR-LfD plans to use the other arm to transport it to a commonly-reachable position before performing insertion.
