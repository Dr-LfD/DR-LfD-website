  - title: 'Reactive Recovery'
    id: section-5
    text: |
      After each learned skill, a wrist-camera contact detector checks whether the expected contact is established. If it is not, DR-LfD re-perceives the scene and replans locally.

      <figure>
        <img src="paper-figures/online-planning-execution.png" alt="Paper Fig. 3(d): execution feeds contact observations back to scene perception and detailed TAMP for local replanning." loading="lazy" style="display:block;width:100%;max-width:650px;height:auto;margin:0 auto;" />
        <figcaption>Online planning and execution.</figcaption>
      </figure>

      When an operator moves the target object away before the grasp, DR-LfD recovers and succeeds in 9/10 Object Handoff, 5/10 Screwdriver Packing, and 10/10 Cup Wiping trials.

