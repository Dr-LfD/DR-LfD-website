  - title: 'Statistical Results'
    text: |
      #### Spatial Generalization — Real World (n = 20 per setup)

      Three tasks on ALOHA hardware. **ID**: in-distribution placements. **OOD**: position/rotation shift. **Leaky**: target object rotated and leaning against a distractor.

      | Task | Setup | DP | π₀.₅ | **DR-LfD** |
      |---|---|---|---|---|
      | Object Handoff | ID | 90% | 100% | **100%** |
      | | OOD | 30% | 20% | **95%** |
      | | Leaky | 60% | 90% | **100%** |
      | Screwdriver Packing | ID | 55% | 60% | **80%** |
      | | OOD | 10% | 10% | **80%** |
      | | Leaky | 0% | **75%** | 65% |
      | Cup-sleeve Insertion | ID | 75% | **85%** | 80% |
      | | OOD | 35% | 25% | **75%** |
      | | Leaky | 35% | 35% | **40%** |

      DR-LfD consistently dominates under OOD placement shifts, including outperforming the large pretrained π₀.₅ model. Under the Leaky condition, Screwdriver Packing shows π₀.₅ ahead (75% vs 65%), and Cup-sleeve Leaky is low for all methods — a conjunctive effect of fine-grained insertion requirements and noisy single-view depth sensing.

  - title: 'Simulation Benchmarks (LIBERO & DexMimicGen)'
    text: |
      DR-LfD (Closed-loop) matches or outperforms all baselines across LIBERO Spatial, Object, and Long subsets, and across DexMimicGen bimanual threading and assembly tasks.
