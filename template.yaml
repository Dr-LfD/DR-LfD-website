  - title: 'Real-world Task Settings'
    id: section-8
    text: |
      <details>
      <summary><strong>Hardware, task procedures, placements, and success criteria</strong></summary>

      #### Hardware setup

      Real-world comparisons use ALOHA with an overhead Intel RealSense D435i RGB-D camera for 3D perception.

      #### Comparative tasks

      **Cup-sleeve Insertion.** The left arm grasps the sleeve and the right arm grasps the cup. The arms align the objects and insert the cup fully into the sleeve to complete the task.

      **Screwdriver Packing.** The left gripper places the screwdriver into its target pose inside the box. The right gripper closes the lid, and both grippers press it shut. Success requires the screwdriver inside the box and the lid fully closed.

      **Object Handoff.** The right gripper picks up the tape and passes it to the left gripper, which then places it down. Success is recorded when the left gripper firmly grasps the tape.

      <article class="media-card">
        <div class="media-card__copy">
          <h3>Initial Object Placements</h3>
          <p>Top: the sleeve starts in the left blue region and the cup in the right green region; both regions are enlarged in OOD. Middle: the screwdriver center starts in the purple region with heading selected from {−10°, 0°, 10°}; OOD enlarges the region to cover most of the left half of the table and randomizes the heading continuously. Bottom: the tape starts on the right side of the table; OOD enlarges its placement region.</p>
        </div>
        <figure>
          <img src="paper-figures/real-world-exp-setting.png" alt="Initial placements for cup-sleeve insertion, screwdriver packing, and object handoff under ID, OOD, and Leaky settings." loading="lazy" />
        </figure>
      </article>

      **Leaky placements.** Support objects tilt the targets: the cup and sleeve along the pitch axis, the screwdriver by approximately 5°, and the tape against a mouse at approximately 30° pitch. These supports are modeled as static background and excluded from the `IsSafePolicy` obstacle check.

      #### Cup-Sponge-Screwdriver

      Four demonstration sets train the component skills: screwdriver packing (a₁), cup handoff (a₂), and cup wiping (a₃), each with all objects in the scene; and a second screwdriver-packing set with the sponge and cup removed.

      <article class="media-card">
        <div class="media-card__copy">
          <h3>Training and Deployment</h3>
          <p>Panels (a)–(c): during data collection, task objects occupy small regions with fixed orientations—the screwdriver for a₁, the cup for a₂, and the cup and sponge for a₃. Panel (d): deployment composes the three skills in one scene. The screwdriver starts randomly within the large purple region, with heading sampled from (−90°, 90°). The cup and sponge start randomly within the large yellow region, with headings sampled from (−45°, 45°).</p>
        </div>
        <figure>
          <img src="paper-figures/tro-3skills-init-1col.png" alt="Demonstration placements for three skills and deployment placements for their combined task." loading="lazy" />
        </figure>
      </article>

      **Success criteria.** Success requires all three subtasks: the right gripper passes the cup to the left; the right-held sponge contacts the left-held cup; and the screwdriver is inside the closed box. All objects rest on the table at completion.

      </details>

