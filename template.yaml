  - title: 'Statistical Results'
    id: section-6
    highlight: |
      <p class="eyebrow">Real-world evaluation / Unseen placements</p>
      <h3 class="results-headline">Higher success across all three OOD tasks.</h3>
      <p class="results-intro">Success rates under OOD position and rotation shifts. ALOHA · 20 trials per task and method.</p>
      <div class="comparison-grid">
        <article class="comparison-card"><h4>Object handoff</h4><p class="comparison-value">95<span>%</span></p><p class="comparison-gain">+65 pp over the best evaluated baseline</p>
          <div class="comparison-row ours"><span>DR-LfD</span><div class="comparison-track"><div style="width:95%"></div></div><strong>95%</strong></div>
          <div class="comparison-row baseline"><span>DP</span><div class="comparison-track"><div style="width:30%"></div></div><strong>30%</strong></div>
          <div class="comparison-row baseline"><span>π₀.₅</span><div class="comparison-track"><div style="width:20%"></div></div><strong>20%</strong></div>
        </article>
        <article class="comparison-card"><h4>Screwdriver packing</h4><p class="comparison-value">80<span>%</span></p><p class="comparison-gain">+70 pp over the best evaluated baseline</p>
          <div class="comparison-row ours"><span>DR-LfD</span><div class="comparison-track"><div style="width:80%"></div></div><strong>80%</strong></div>
          <div class="comparison-row baseline"><span>DP</span><div class="comparison-track"><div style="width:10%"></div></div><strong>10%</strong></div>
          <div class="comparison-row baseline"><span>π₀.₅</span><div class="comparison-track"><div style="width:10%"></div></div><strong>10%</strong></div>
        </article>
        <article class="comparison-card"><h4>Cup-sleeve insertion</h4><p class="comparison-value">75<span>%</span></p><p class="comparison-gain">+40 pp over the best evaluated baseline</p>
          <div class="comparison-row ours"><span>DR-LfD</span><div class="comparison-track"><div style="width:75%"></div></div><strong>75%</strong></div>
          <div class="comparison-row baseline"><span>DP</span><div class="comparison-track"><div style="width:35%"></div></div><strong>35%</strong></div>
          <div class="comparison-row baseline"><span>π₀.₅</span><div class="comparison-track"><div style="width:25%"></div></div><strong>25%</strong></div>
        </article>
      </div>
    text: |
      <details>
      <summary>Full results, evaluation protocol, and limitations</summary>

      #### Spatial Generalization — Real World (n = 20 per setup)

      Three tasks on ALOHA hardware. **ID**: in-distribution placements. **OOD**: position/rotation shift. **Leaky**: target object rotated and leaning against a distractor.

      | Task | Setup | DP | π₀.₅ | **DR-LfD** |
      |---|---|---|---|---|
      | Object Handoff | ID | 90% | 100% | **100%** |
      | | OOD | 30% | 20% | **95%** |
      | | Leaky | 60% | 90% | **100%** |
      | Screwdriver Packing | ID | 55% | 60% | **80%** |
      | | OOD | 10% | 10% | **80%** |
      | | Leaky | 0% | **75%** | 65% |
      | Cup-sleeve Insertion | ID | 75% | **85%** | 80% |
      | | OOD | 35% | 25% | **75%** |
      | | Leaky | 35% | 35% | **40%** |

      DR-LfD achieves the highest success rate on all three OOD tasks. In the Leaky setting, π₀.₅ leads on Screwdriver Packing (75% vs 65%). Cup-sleeve Insertion remains difficult for all methods; fine insertion and noisy single-view depth sensing contribute to failures.

      </details>

