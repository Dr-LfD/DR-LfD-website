abstract: |
  DR-LfD (<u>D</u>ecomposed and <u>R</u>eorganized Skills <u>L</u>earned <u>f</u>rom <u>D</u>emonstrations) combines learned manipulation skills with task and motion planning (TAMP) for long-horizon, contact-rich tasks. Contact changes partition demonstrations into atomic skills, learned as visuomotor policies or object-centric primitives. TAMP-compatible initiation conditions, termination conditions, and physical constraints let the planner compose skills learned from different sources. Demonstration collection scales with the number of distinct skill types, while the planner reuses these skills across task sequences. Real-world and simulation experiments evaluate spatial generalization, long-horizon composition, and physical constraint handling.

