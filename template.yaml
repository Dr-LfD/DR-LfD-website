  - title: 'Key Contributions'
    id: section-0
    text: |
      > **Core idea:** DR-LfD learns individual manipulation skills from demonstrations and composes them with TAMP to achieve new task goals.

      - **TAMP-gated system** — Contact changes define atomic skills that TAMP composes into task plans.
      - **Object-centric primitives** — Equivariant diffusion models learn object-centric primitives that adapt to new object positions and orientations.
      - **TAMP-compatible visuomotor policies** — Initiation conditions, termination conditions, and physical constraints connect learned policies to sampling-based TAMP.
      - **Evaluation** — Real-world and simulation experiments test skill composition, spatial generalization, and physical constraint handling against imitation learning baselines.

  - title: 'How It Works'
    id: section-1
    text: |
      <details>
      <summary><strong>Method pipeline and implementation details</strong></summary>

      <div class="method-pipeline" aria-label="DR-LfD method pipeline">
        <div><strong>1</strong><span>Demonstrate</span></div>
        <div><strong>2</strong><span>Decompose<br>by contact</span></div>
        <div><strong>3</strong><span>Learn skill<br>repertoire</span></div>
        <div><strong>4</strong><span>Plan with<br>TAMP</span></div>
        <div><strong>5</strong><span>Execute &amp;<br>verify</span></div>
      </div>

      1. **Demonstrate** — Record about 20 teleoperated demonstrations per short skill.
      <article class="media-card">
        <div class="media-card__copy">
          <h3>2. Decompose by contact</h3>
          <p>A VLM identifies robot–object and object–object contact changes. These changes define atomic skills and their start and end conditions.</p>
        </div>
        <figure>
          <img src="paper-figures/vlm-grounding.png" style="max-width:670px" alt="VLM-based contact relationship grounding for demonstration decomposition" loading="lazy" />
        </figure>
      </article>

      <article class="media-card media-card--stacked">
        <div class="media-card__copy">
          <h3>3. Learn each skill</h3>
          <p>Train object-centric primitives for pick-and-place actions and visuomotor policies for contact-rich actions. Use standard TAMP motion skills for free-space moves.</p>
        </div>
        <figure>
          <img src="paper-figures/skillequivNet.png" style="max-width:1000px" alt="SO(3)-equivariant object-centric skill network" loading="lazy" />
        </figure>
      </article>

      4. **Plan a new task** — TAMP selects and orders the learned skills, adding regrasping or obstacle removal to satisfy safety and reachability constraints.
      5. **Execute and verify** — The robot perceives, plans, executes, and verifies each step. Failed steps trigger local replanning.

      </details>

