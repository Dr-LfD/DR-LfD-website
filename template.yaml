  - title: 'Real-world Task Settings'
    id: section-8
    text: |
      <details>
      <summary><strong>Tasks and initial placements</strong></summary>

      All real-world tasks run on a bimanual ALOHA robot with one overhead RGB-D camera.

      #### Comparative tasks

      **Object Handoff.** The right arm hands a tape roll to the left arm.

      **Screwdriver Packing.** The robot packs a screwdriver into its box and closes the lid.

      **Cup-sleeve Insertion.** The two arms insert a paper cup fully into a cup sleeve.

      <article class="media-card">
        <div class="media-card__copy">
          <h3>Initial Object Placements</h3>
          <p>Colored regions mark where each object starts. ID tests use the same regions as the demonstrations, and OOD tests enlarge every region. For Screwdriver Packing, OOD also replaces the three demonstrated headings (−10°, 0°, 10°) with a continuous range. Leaky tests tilt the target objects against static supports.</p>
        </div>
        <figure>
          <img src="paper-figures/real-world-exp-setting.png" style="max-width:500px" alt="Initial placements for cup-sleeve insertion, screwdriver packing, and object handoff under ID, OOD, and Leaky settings." loading="lazy" />
        </figure>
      </article>

      #### Cup-Sponge-Screwdriver

      This long-horizon task composes three skills: screwdriver packing, cup handoff, and cup wiping. Each skill is learned from 20 demonstrations.

      <article class="media-card">
        <div class="media-card__copy">
          <h3>Training and Deployment</h3>
          <p>Each skill is demonstrated separately, with its objects in a small region at a fixed orientation (a–c). At deployment, all three skills run in one scene, and the objects start anywhere in much larger regions (d). The screwdriver heading varies within (−90°, 90°), and the cup and sponge headings vary within (−45°, 45°).</p>
        </div>
        <figure>
          <img src="paper-figures/tro-3skills-init-1col.png" style="max-width:560px" alt="Demonstration placements for three skills and deployment placements for their combined task." loading="lazy" />
        </figure>
      </article>

      </details>

  - title: 'Skill Reuse and Composition'
    id: section-4
    text: |
      **Cup-Sponge-Screwdriver.** DR-LfD composes three separately learned skills into a 19-step plan with three distinct bimanual operations. DP and π₀.₅ are trained on the same 60 demonstrations. π₀.₅ is competitive with DR-LfD under ID placements, while DR-LfD outperforms both DP and π₀.₅ under OOD placements. Success rates over 20 real-world trials:

      | Initial placements | DP | π₀.₅ | DR-LfD |
      |---|---|---|---|
      | ID | 20% | 70% | 55% |
      | OOD | 0% | 10% | 50% |

      **Skill improvement under clutter.** With four distractors on the table, the success rate of DR-LfD drops from 50% to 0%. Because skills are learned separately, retraining each skill with five cluttered-background demonstrations restores the success rate to 55%, without recollecting any long-horizon demonstration.

      <figure>
        <img src="paper-figures/stress-tests.png" alt="Real-world stress tests from the paper: clutter scene, task success and completed steps with zero to four distractors, and comparisons on novel object instances." loading="lazy" style="display:block;width:100%;max-width:990px;height:auto;margin:0 auto;" />
        <figcaption>Real-world stress tests with 20 rollouts per setting. (b) Cup-Sponge-Screwdriver with zero to four distractors. 4+R denotes four distractors after each skill is retrained. Bars show the success rate, and diamonds show the average number of completed steps (ANCS) as a percentage of all task steps. (c) Standard and novel object instances. (d) Success rates with standard (hollow markers) and novel (filled markers) instances.</figcaption>
      </figure>


      <article class="media-card">
        <div class="media-card__copy">
          <h3>Skill composition and reuse</h3>
          <p>TAMP composes three separately learned skills into one long-horizon task: screwdriver packing, cup handoff, and cup wiping.</p>
